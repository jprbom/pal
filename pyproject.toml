[project]
name = "pal"
version = "1.0.0"
description = "Personal knowledge agent that learns how you work."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os]",
  "aiohttp",
  "google-api-python-client",
  "google-auth-oauthlib",
  "google-auth",
  "mcp",
  "openai",
  "parallel-web",
  "pgvector",
  "psycopg[binary]",
  "slack-sdk",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "types-PyYAML"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pal*", "db*", "app*", "evals*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "agno.*", "httpx.*", "mcp.*", "google.*", "googleapiclient.*", "slack_sdk.*", "parallel.*"]
ignore_missing_imports = true

[tool.uv.pip]
no-annotate = true
